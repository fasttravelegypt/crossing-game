<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frog Game Scalable</title>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
}

#gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    background: #88c070;
    touch-action: manipulation;
}

#controls {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 22%;
    display: flex;
    background: #111;
}

.control-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    border-left: 1px solid #333;
    user-select: none;
}

.control-btn:first-child {
    border-left: none;
}
</style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div class="control-btn" id="btnLeft">LEFT</div>
        <div class="control-btn" id="btnForward">JUMP</div>
        <div class="control-btn" id="btnRight">RIGHT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const controls = document.getElementById('controls');

const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resizeCanvas() {
    const cssWidth = window.innerWidth;
    const cssHeight = window.innerHeight - controls.offsetHeight;

    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";

    canvas.width = Math.floor(cssWidth * DPR);
    canvas.height = Math.floor(cssHeight * DPR);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => {
    resizeCanvas();
    generateLanes();
    resetPlayer();
});
resizeCanvas();

const totalLanes = 10;
const middleSafeLane = Math.floor(totalLanes / 2);
let lanes = [];

/* ===== PLAYER ===== */
const player = { width: 0, height: 0, x: 0, y: 0 };
const playerImage = new Image();

let assetsLoaded = 0;
let assetsReady = false;

playerImage.onload = () => {
    assetsLoaded++;
    checkAssetsReady();
};
playerImage.src = 'assets/player.png';

function checkAssetsReady() {
    if (assetsLoaded === 1) {
        assetsReady = true;
        loading = false;
        gameStarted = true;
        resetPlayer();
    }
}

let gameStarted = false;
let loading = true;
let level = 1;

const OBSTACLE_TYPES = [
    { name: 'carSlow', width: 0.18, speed: 1.2, max: 2, minLevel: 1, color: '#2c3e50' },
    { name: 'carNormal', width: 0.18, speed: 1.8, max: 3, minLevel: 2, color: '#34495e' },
    { name: 'carFast', width: 0.18, speed: 2.5, max: 3, minLevel: 3, color: '#7f8c8d' },
    { name: 'carVeryFast', width: 0.18, speed: 4.5, max: 2, minLevel: 6, color: '#e74c3c' },
    { name: 'bikeFast', width: 0.10, speed: 2.8, max: 3, minLevel: 3, color: '#16a085' },
    { name: 'bikeVFast', width: 0.10, speed: 3.5, max: 3, minLevel: 5, color: '#27ae60' },
    { name: 'midTruck', width: 0.28, speed: 1.6, max: 2, minLevel: 5, color: '#d35400' },
    { name: 'bigTruck', width: 0.35, speed: 1.2, max: 2, minLevel: 7, color: '#c0392b' }
];

function generateLanes() {
    lanes = [];
    const laneHeight = canvas.height / DPR / totalLanes;
    const difficultyStage = Math.floor((level - 1) / 3);

    const fastNames = ['carFast','carVeryFast','bikeFast','bikeVFast'];
    let fastRatio = Math.min(0.9, (level - 1) / 39 * 0.9);

    for (let i = 0; i < totalLanes; i++) {
        let isSafe = i === 0 || i === totalLanes - 1 || (i === middleSafeLane && level < 30);
        let lane = { y: i * laneHeight, safe: isSafe, obstacles: [] };

        if (!lane.safe) {
            let eligible = OBSTACLE_TYPES.filter(t => level >= t.minLevel);
            let fastEligible = eligible.filter(t => fastNames.includes(t.name));
            let normalEligible = eligible.filter(t => !fastNames.includes(t.name));

            let obstacle = (fastEligible.length && Math.random() < fastRatio)
                ? fastEligible[Math.floor(Math.random() * fastEligible.length)]
                : normalEligible[Math.floor(Math.random() * normalEligible.length)];

            const count = Math.min(1 + difficultyStage, obstacle.max);
            const w = (canvas.width / DPR) * obstacle.width;
            const dir = Math.random() < 0.5 ? 1 : -1;
            const spacing = w * 1.5;

            for (let j = 0; j < count; j++) {
                lane.obstacles.push({
                    x: j * spacing,
                    width: w,
                    height: laneHeight * 0.8,
                    speed: obstacle.speed * dir,
                    color: obstacle.color
                });
            }
        }

        lanes.push(lane);
    }
}

generateLanes();

function resetPlayer() {
    const laneHeight = canvas.height / DPR / totalLanes;
    player.width = (canvas.width / DPR * 0.3) / 2;
    player.height = (laneHeight * 0.8) / 2;
    player.x = (canvas.width / DPR - player.width) / 2;
    player.y = lanes[totalLanes - 1].y + (laneHeight - player.height) / 2;
}

function jumpForward() {
    if (!gameStarted) return;
    const laneHeight = canvas.height / DPR / totalLanes;
    player.y -= laneHeight;
    if (player.y < 0) player.y = 0;
}
function jumpLeft() {
    if (!gameStarted) return;
    player.x -= player.width * .5;
    if (player.x < 0) player.x = 0;
}
function jumpRight() {
    if (!gameStarted) return;
    player.x += player.width * .5;
    if (player.x + player.width > canvas.width / DPR) {
        player.x = canvas.width / DPR - player.width;
    }
}

/* ===== CONTROL BUTTON EVENTS ===== */
['btnLeft','btnForward','btnRight'].forEach(id => {
    document.getElementById(id).addEventListener('touchstart', e => {
        e.preventDefault();
        if (!gameStarted) return;
        if (id === 'btnLeft') jumpLeft();
        if (id === 'btnForward') jumpForward();
        if (id === 'btnRight') jumpRight();
    });
});

function update() {
    if (!gameStarted) return;

    lanes.forEach(lane => {
        lane.obstacles.forEach(o => {
            o.x += o.speed;
            if (o.speed > 0 && o.x > canvas.width / DPR) o.x = -o.width;
            if (o.speed < 0 && o.x + o.width < 0) o.x = canvas.width / DPR;
        });
    });

    const laneHeight = canvas.height / DPR / totalLanes;
    const idx = Math.round(player.y / laneHeight);
    const lane = lanes[idx];

    if (lane && !lane.safe) {
        lane.obstacles.forEach(o => {
            if (player.x < o.x + o.width && player.x + player.width > o.x) {
                resetPlayer();
            }
        });
    }

    if (idx === 0) {
        level++;
        generateLanes();
        resetPlayer();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const h = canvas.height / DPR / totalLanes;

    lanes.forEach(l => {
        if (l.safe) {
            ctx.fillStyle = '#666';
            ctx.fillRect(0, l.y, canvas.width / DPR, h);
        }
        l.obstacles.forEach(o => {
            ctx.fillStyle = o.color;
            ctx.fillRect(o.x, l.y, o.width, o.height);
        });
    });

    if (playerImage.complete) {
        ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);
    }

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'right';
    ctx.fillText(`Level: ${level}`, canvas.width / DPR - 10, 30);
}

function drawLoadingScreen() {
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, canvas.width / DPR, canvas.height / DPR);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText("Loading assets...", canvas.width / DPR / 2, canvas.height / DPR / 2);
}

function gameLoop() {
    if (!assetsReady || loading) {
        drawLoadingScreen();
    } else {
        update();
        draw();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
